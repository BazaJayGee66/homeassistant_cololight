name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Upload cololight.zip
        if: ${{ steps.release.outputs.release_created }}
        working-directory: custom_components
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          zip -r cololight.zip cololight -x "*/__pycache__/*"
          gh release upload "$TAG_NAME" cololight.zip
