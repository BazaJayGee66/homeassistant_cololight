[project]
name = "homeassistant-cololight"
# Placeholder that uv requires. The integration's version is in manifest.json.
version = "0.0.0"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "pycololight==2.1.0",
    "pytest-homeassistant-custom-component==0.13.374",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--cov=custom_components"]
asyncio_mode = "auto"
